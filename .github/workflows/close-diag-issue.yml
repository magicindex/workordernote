name: close-diag-issue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-diag-issue.yml'

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close 1 -R "$GITHUB_REPOSITORY" -c "诊断完成：GitHub runner 到 60.232.156.16:10241 TCP 超时，不是 WAF 的 403。" || true
