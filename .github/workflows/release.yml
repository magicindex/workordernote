name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build assets
        run: |
          V="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="workordernote-$V/" -o "workordernote-$V-source.tar.gz" HEAD
          git bundle create "workordernote-$V.bundle" --all
          sha256sum workordernote-$V-source.tar.gz workordernote-$V.bundle > "workordernote-$V-SHA256SUMS.txt"
      - uses: softprops/action-gh-release@v2
        with:
          name: 工作序记 ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            workordernote-*-source.tar.gz
            workordernote-*.bundle
            workordernote-*-SHA256SUMS.txt
            assets/fnpack/*.fpk
            assets/fnpack/screenshots-*.zip
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: true
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      - name: Save image for release
        run: |
          V="${GITHUB_REF_NAME#v}"
          docker save "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}" | gzip -9 > "workordernote-$V-image.tar.gz"
          sha256sum "workordernote-$V-image.tar.gz" >> "workordernote-$V-SHA256SUMS.txt"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            workordernote-*-image.tar.gz
            workordernote-*-SHA256SUMS.txt
          overwrite_files: true
