name: mirror-image

# 把 Gitea 容器仓库里的正式镜像同步到 GHCR，补齐不带 v 的版本标签。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror from Gitea registry
        run: |
          V="$(cat VERSION)"
          SRC="gitea.topzero.cn:10241/cyberzero/workordernote:${V}"
          if ! docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:${V}" \
            --tag "ghcr.io/${{ github.repository }}:v${V}" \
            --tag "ghcr.io/${{ github.repository }}:latest" \
            "$SRC"; then
            echo "Gitea registry is not reachable from the runner; reusing the GHCR v-tag built from the same source."
            docker buildx imagetools create \
              --tag "ghcr.io/${{ github.repository }}:${V}" \
              --tag "ghcr.io/${{ github.repository }}:latest" \
              "ghcr.io/${{ github.repository }}:v${V}"
          fi

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH /user/packages/container/workordernote \
            -H 'Accept: application/vnd.github+json' \
            -f visibility=public || echo 'visibility update failed'
