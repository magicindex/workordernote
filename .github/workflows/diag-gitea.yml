name: diag-gitea

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-gitea.yml'

permissions:
  contents: read
  issues: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Probe
        continue-on-error: true
        run: |
          {
            echo "## resolver"
            getent ahosts gitea.topzero.cn || true
            echo "## registry v2"
            curl -sS -o /dev/null -w 'http=%{http_code} ip=%{remote_ip} tls=%{ssl_verify_result}\n' https://gitea.topzero.cn:10241/v2/ || true
            echo "## token endpoint"
            curl -sS -o /dev/null -w 'http=%{http_code}\n' 'https://gitea.topzero.cn:10241/v2/token?service=gitea&scope=repository:cyberzero/workordernote:pull' || true
            echo "## imagetools inspect"
            docker buildx imagetools inspect gitea.topzero.cn:10241/cyberzero/workordernote:0.41.0 || true
          } 2>&1 | tee /tmp/diag.log

      - name: Publish result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" -t "diag-gitea $GITHUB_RUN_ID" -F /tmp/diag.log || true
